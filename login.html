<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Scorp</title>
  <style>
    body {
      background: linear-gradient(135deg, #121212, #1f1f1f);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-box {
      background: #1e1e1e;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 300px;
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: #ff7b00;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 1em;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ff7b00;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #e96a00;
    }

    .back {
      margin-top: 15px;
      color: #ccc;
      font-size: 0.9em;
      cursor: pointer;
      text-decoration: underline;
    }

    .error {
      color: red;
      font-size: 0.9em;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password (8+ chars)" required>
    <div class="error" id="errorMsg">Invalid credentials</div>
    <button onclick="login()">Login</button>
    <div class="back" onclick="goBack()">← Back to Home</div>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user && pass.length >= 8) {
        localStorage.setItem("scorp_logged_in", "true");
        localStorage.setItem("scorp_user", user);
        window.location.href = "home.html";
      } else {
        document.getElementById("errorMsg").style.display = "block";
      }
    }

    function goBack() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
