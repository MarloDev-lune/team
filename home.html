<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home | Scorp</title>
  <style>
    body {
      background: #1c1c1c;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px;
    }

    h1 {
      color: #ff7b00;
    }

    .username {
      margin-top: 10px;
      font-size: 1.3em;
      color: #ccc;
    }

    .logout {
      margin-top: 30px;
      background: #ff4040;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 1em;
      transition: 0.3s ease;
    }

    .logout:hover {
      background: #cc0000;
    }

    .section {
      margin-top: 40px;
    }

    .section h3 {
      color: #ff7b00;
      margin-bottom: 10px;
    }

    .btn {
      background: #333;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      margin: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <h1>Welcome to Scorp</h1>
  <div class="username">Hello, <span id="userName"></span></div>

  <button class="logout" onclick="logout()">Logout</button>

  <div class="section">
    <h3>Explore:</h3>
    <button class="btn">Friends</button>
    <button class="btn">Messages</button>
    <button class="btn">Photos</button>
    <button class="btn">Settings</button>
  </div>

  <script>
    const loggedIn = localStorage.getItem("scorp_logged_in");
    const user = localStorage.getItem("scorp_user");

    if (!loggedIn) {
      alert("Please login first.");
      window.location.href = "login.html";
    } else {
      document.getElementById("userName").innerText = user;
    }

    function logout() {
      localStorage.removeItem("scorp_logged_in");
      localStorage.removeItem("scorp_user");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
